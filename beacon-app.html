<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLETHIC BEACON — Cognitive Self-Defense Laboratory</title>
  
  <!-- Librerías Externas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --cyber-cyan: #00f0ff;
      --cyber-blue: #0077ff;
      --cyber-red: #ff0055;
      --cyber-green: #00ff66;
      --cyber-amber: #ffaa00;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-title {
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .lang-selector {
      display: flex;
      gap: 10px;
    }

    .btn-lang {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .btn-lang.active, .btn-lang:hover {
      color: var(--cyber-cyan);
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(10, 14, 23, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 15px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 15px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .input-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .btn-file {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-file:hover {
      background: var(--cyber-cyan);
      color: var(--bg-dark);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--cyber-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .btn-primary:hover {
      background: #33f3ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .btn-danger {
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid var(--cyber-red);
      color: var(--cyber-red);
    }

    .btn-danger:hover {
      background: var(--cyber-red);
      color: white;
    }

    .btn-secondary {
      background: rgba(0, 119, 255, 0.2);
      border: 1px solid var(--cyber-blue);
      color: var(--cyber-blue);
    }

    .btn-secondary:hover {
      background: var(--cyber-blue);
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ethic-badge {
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      background: var(--cyber-cyan);
      color: var(--bg-dark);
    }

    .flag-badge {
      display: inline-block;
      padding: 4px 8px;
      margin: 2px;
      border-radius: 3px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .report-content {
      white-space: pre-wrap;
      line-height: 1.6;
      font-family: 'Courier New', Courier, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 6px;
      border-left: 3px solid var(--cyber-cyan);
      max-height: 500px;
      overflow-y: auto;
    }

    .status-bar {
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--cyber-cyan);
    }
  </style>
</head>
<body>

  <div id="stars-container"></div>

  <div class="app-container">
    <header>
      <div class="logo-zone">
        <div class="logo-title">POLETHIC BEACON</div>
      </div>
      <div class="lang-selector">
        <button class="btn-lang active" data-lang="fr">FR</button>
        <button class="btn-lang" data-lang="es">ES</button>
        <button class="btn-lang" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section class="panel input-panel">
        <textarea id="user-input" placeholder="Collez votre texte, lien YouTube ou téléchargez un fichier ici..."></textarea>
        
        <div class="input-controls">
          <div class="file-input-wrapper">
            <label for="user-file" class="btn-file" id="lbl-file">Fichier / File</label>
            <input type="file" id="user-file" accept="image/*,application/pdf">
            <span id="file-name" style="margin-left: 10px; font-size: 0.85rem; color: var(--text-muted);"></span>
          </div>

          <div class="action-btns">
            <button id="btn-purge" class="btn btn-danger">Purge</button>
            <button id="btn-analyze" class="btn btn-primary">Analyser</button>
          </div>
        </div>
      </section>

      <section class="panel results-panel" id="results-panel" style="display: none;">
        <div class="results-header">
          <div id="ethic-score" class="ethic-badge">Ethic-Score™: --</div>
          <div id="detected-flags">
            <span class="flag-badge" id="txt-ready">ANALYSE PRÊTE</span>
          </div>
        </div>

        <div id="analysis-report" class="report-content">En attente d'analyse...</div>

        <div class="input-controls" style="margin-top: 20px;">
          <button id="btn-refute" class="btn btn-secondary">Refutar / Défi</button>
          <button id="btn-pdf" class="btn btn-primary">Export PDF</button>
        </div>

        <div class="status-bar" id="txt-status">● SYSTEM ONLINE</div>
      </section>
    </main>
  </div>

  <script>
    // Configurar Worker de PDF.js
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const API_BASE_URL = 'https://polethic-beacon.onrender.com';

    const langMap = {
      fr: {
        fileBtn: 'Fichier / File',
        noAnalysisAlert: "Aucune analyse disponible pour la réfutation.",
        refuting: "Réfutation en cours...",
        refuteBtn: "Réfuter / Défi",
        noExportAlert: "Aucun rapport disponible à exporter."
      },
      es: {
        fileBtn: 'Archivo / File',
        noAnalysisAlert: "No hay un análisis disponible para refutar.",
        refuting: "Refutando...",
        refuteBtn: "Refutar / Défi",
        noExportAlert: "No hay informe disponible para exportar."
      },
      en: {
        fileBtn: 'File / Upload',
        noAnalysisAlert: "No analysis available to refute.",
        refuting: "Refuting...",
        refuteBtn: "Refute / Challenge",
        noExportAlert: "No report available for export."
      }
    };

    let currentLang = 'fr';
    let lastAnalyzedText = "";
    let currentScoreLetter = 'C';
    let spinnerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      const userInput = document.getElementById('user-input');
      const userFile = document.getElementById('user-file');
      const fileNameDisplay = document.getElementById('file-name');
      const btnAnalyze = document.getElementById('btn-analyze');
      const btnPurge = document.getElementById('btn-purge');
      const btnRefute = document.getElementById('btn-refute');
      const btnPdf = document.getElementById('btn-pdf');
      const resultsPanel = document.getElementById('results-panel');
      const analysisReport = document.getElementById('analysis-report');
      const ethicScore = document.getElementById('ethic-score');
      const detectedFlags = document.getElementById('detected-flags');

      function generateStars() {
        const container = document.getElementById('stars-container');
        if (!container) return;
        container.innerHTML = '';
        for (let i = 0; i < 80; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.width = `${Math.random() * 3}px`;
          star.style.height = star.style.width;
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 100}%`;
          star.style.animationDuration = `${2 + Math.random() * 3}s`;
          container.appendChild(star);
        }
      }
      generateStars();

      document.querySelectorAll('.btn-lang').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentLang = e.target.getAttribute('data-lang');
          document.getElementById('lbl-file').innerText = langMap[currentLang].fileBtn;
        });
      });

      userFile.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          fileNameDisplay.innerText = e.target.files[0].name;
        } else {
          fileNameDisplay.innerText = '';
        }
      });

      function startEthicSpinner() {
        let frames = ['[  =  ]', '[ ==  ]', '[ === ]', '[  == ]'];
        let idx = 0;
        spinnerInterval = setInterval(() => {
          ethicScore.innerText = `Ethic-Score™: ${frames[idx % frames.length]}`;
          idx++;
        }, 200);
      }

      function stopEthicSpinner() {
        if (spinnerInterval) clearInterval(spinnerInterval);
      }

      function applyEthicBadge(score, flags = []) {
        stopEthicSpinner();
        currentScoreLetter = score || 'C';
        ethicScore.innerText = `Ethic-Score™: ${currentScoreLetter}`;

        let colorMap = {
          'A': 'var(--cyber-green)',
          'B': 'var(--cyber-cyan)',
          'C': 'var(--cyber-amber)',
          'D': 'var(--cyber-red)'
        };
        ethicScore.style.backgroundColor = colorMap[currentScoreLetter] || 'var(--cyber-amber)';

        if (detectedFlags && Array.isArray(flags)) {
          detectedFlags.innerHTML = flags.map(f => `<span class="flag-badge">${f}</span>`).join('');
        }
      }

      async function extractTextFromImage(file) {
        document.getElementById('txt-status').innerText = '● LECTURE OCR (TESSERACT)...';
        const worker = await Tesseract.createWorker(currentLang === 'es' ? 'spa' : (currentLang === 'fr' ? 'fra' : 'eng'));
        const ret = await worker.recognize(file);
        await worker.terminate();
        return ret.data.text;
      }

      async function extractTextFromPDF(file) {
        document.getElementById('txt-status').innerText = '● EXTRACTION PDF...';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(' ') + '\n';
        }
        return fullText;
      }

      function extractYouTubeID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      }

      // ⚡ ANALIZAR
      btnAnalyze.addEventListener('click', async () => {
        let textToAnalyze = userInput.value.trim();
        const file = userFile.files[0];

        if (!textToAnalyze && !file) {
          const errorMsg = {
            es: 'Por favor ingrese texto, una URL de YouTube o adjunte un archivo.',
            fr: 'Veuillez entrer du texte, un lien YouTube ou joindre un fichier.',
            en: 'Please enter text, a YouTube link or attach a file.'
          };
          return alert(errorMsg[currentLang] || errorMsg.fr);
        }

        btnAnalyze.disabled = true;
        resultsPanel.style.display = 'block';
        startEthicSpinner();

        try {
          if (file) {
            if (file.type.startsWith('image/')) {
              textToAnalyze = await extractTextFromImage(file);
            } else if (file.type === 'application/pdf') {
              textToAnalyze = await extractTextFromPDF(file);
            }
          } else if (extractYouTubeID(textToAnalyze)) {
            const videoId = extractYouTubeID(textToAnalyze);
            document.getElementById('txt-status').innerText = `● RÉCUPÉRATION DU TRANSCRIPT YOUTUBE (${videoId})...`;
            
            const ytResponse = await fetch(`${API_BASE_URL}/transcript?videoId=${videoId}`);
            if (!ytResponse.ok) throw new Error(`YouTube API Error: ${ytResponse.status}`);
            const ytData = await ytResponse.json();
            textToAnalyze = ytData.fullText || ytData.text || ytData.transcript;
          }

          if (!textToAnalyze) {
            throw new Error("No se pudo extraer texto del archivo o enlace proporcionado.");
          }

          userInput.value = textToAnalyze;
          lastAnalyzedText = textToAnalyze;

          document.getElementById('txt-status').innerText = '● CONNECTING TO BEACON BACKEND (RENDER)...';
          
          const response = await fetch(`${API_BASE_URL}/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              text: textToAnalyze, 
              prompt: textToAnalyze,
              lang: currentLang 
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          const flagsReceived = data.flags || data.detected_flags || data.categories;
          const scoreReceived = data.ethic_letter || data.score || data.ethic_score || 'C';
          const reportText = data.analysis || data.report || data.response || data.result || 'Analyse terminée.';

          applyEthicBadge(scoreReceived, flagsReceived);
          analysisReport.innerText = reportText;
          document.getElementById('txt-status').innerText = '● ANALYSE TERMINÉE | SYSTEM ONLINE';

        } catch (e) {
          console.error("Error en POLETHIC BEACON:", e);
          applyEthicBadge('C');
          analysisReport.innerText = `⚠️ Error de conexión / processing:\n${e.message}\n\nNota: Si el servidor en Render estuvo inactivo, puede tardar hasta 1 minuto en encender. Por favor, reintente en 30 segundos.`;
          document.getElementById('txt-status').innerText = '● ERREUR SYSTEME / BACKEND OFFLINE';
        } finally {
          btnAnalyze.disabled = false;
        }
      });

      // 🔄 REFUTACIÓN DIRECTA
      btnRefute.addEventListener('click', async () => {
        const currentAnalysis = analysisReport ? analysisReport.innerText : '';
        const t = (typeof langMap !== 'undefined' && langMap[currentLang]) ? langMap[currentLang] : {};

        if (!currentAnalysis || currentAnalysis.includes("En attente") || currentAnalysis.includes("Erreur") || currentAnalysis.includes("⚡")) {
          return alert(t.noAnalysisAlert || "No hay un análisis disponible para refutar.");
        }

        btnRefute.disabled = true;
        btnRefute.innerText = t.refuting || "Refutando...";

        try {
          const response = await fetch(`${API_BASE_URL}/refute`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              analysis: currentAnalysis,
              text: typeof lastAnalyzedText !== 'undefined' ? lastAnalyzedText : '',
              lang: currentLang
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
          }

          const data = await response.json();
          const refutationText = data.refutation || data.reply || data.response || '';

          if (refutationText) {
            analysisReport.innerText += `\n\n========================================\n🔥 DÉFI DU BIAIS (RÉFUTATION COGNITIVE):\n========================================\n${refutationText}`;
          }
        } catch (e) {
          console.error("Error en Refute:", e);
          alert(currentLang === 'es' ? "Error al procesar la refutación. Verifique la conexión." : "Erreur lors du traitement de la réfutation.");
        } finally {
          btnRefute.disabled = false;
          btnRefute.innerText = t.refuteBtn || "Refutar / Défi";
        }
      });

      // 📄 EXPORTAR PDF COMPLETO Y MAQUETADO
      btnPdf.addEventListener('click', () => {
        const reportText = analysisReport ? analysisReport.innerText : '';
        const lang = currentLang || 'fr';
        const t = (typeof langMap !== 'undefined' && langMap[lang]) ? langMap[lang] : {};

        if (!reportText || reportText.includes("En attente") || reportText.includes("Erreur") || reportText.includes("Waiting") || reportText.includes("En espera")) {
          return alert(t.noExportAlert || "No report available");
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 18;
        const contentWidth = pageWidth - (margin * 2);
        let cursorY = margin;

        const WHITELIST = /[^A-Za-z0-9ÀÁÂÃÄÅàáâãäåÇçÈÉÊËèéêëÌÍÎÏìíîïÑñÒÓÔÕÖòóôõöÙÚÛÜùúûüÝýŸÿœŒ¿¡•©™€$%+\-_/.,;:!?'"()\[\]{}\s]/g;

        let cleanText = reportText
          .replace(/\*\*/g, '')
          .replace(/[\u{1F600}-\u{1F6FF}\u{1F300}-\u{1F5FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
          .replace(/«\s*/g, '"').replace(/\s*»/g, '"')
          .replace(WHITELIST, '')
          .trim();

        const localeMap = { fr: 'fr-FR', es: 'es-ES', en: 'en-US' };
        const subHeaderLabels = {
          fr: "LABORATOIRE D'AUTODÉFENSE COGNITIVE",
          es: "LABORATORIO DE AUTODEFENSA COGNITIVA",
          en: "COGNITIVE SELF-DEFENSE LABORATORY"
        };
        const refLabels = { fr: 'RÉF', es: 'REF', en: 'REF' };
        const dateLabels = { fr: 'HORODATAGE', es: 'FECHA Y HORA', en: 'TIMESTAMP' };
        const levelLabels = { fr: 'NIVEAU', es: 'NIVEL', en: 'LEVEL' };
        const flagsHeaderLabels = { fr: 'INDICATEURS', es: 'INDICADORES', en: 'INDICATORS' };

        function printSectionHeader(text, x, y) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11.5);
          doc.setTextColor(15, 23, 42);
          doc.text(text, x, y);

          doc.setDrawColor(0, 200, 235);
          doc.setLineWidth(0.6);
          doc.line(x, y + 3, x + contentWidth, y + 3);
        }

        // ENCABEZADO OFICIAL
        doc.setFont("courier", "bold");
        doc.setFontSize(15);
        doc.setTextColor(15, 23, 42);
        doc.text("POLETHIC BEACON", margin, cursorY + 2);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8.5);
        doc.setTextColor(0, 180, 216);
        doc.text(subHeaderLabels[lang] || subHeaderLabels['fr'], margin, cursorY + 7);

        cursorY += 12;
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.4);
        doc.line(margin, cursorY, pageWidth - margin, cursorY);

        cursorY += 8;

        const now = new Date();
        const timestamp = now.toLocaleDateString(localeMap[lang] || 'fr-FR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        const auditId = `BEACON-2026-${Math.floor(100000 + Math.random() * 900000)}`;

        const scoreLetter = typeof currentScoreLetter !== 'undefined' ? currentScoreLetter : 'C';
        let scoreR = 234, scoreG = 179, scoreB = 8;
        if (scoreLetter === 'A') { scoreR = 16; scoreG = 185; scoreB = 129; }
        if (scoreLetter === 'C') { scoreR = 249; scoreG = 115; scoreB = 22; }
        if (scoreLetter === 'D') { scoreR = 225; scoreG = 29; scoreB = 72; }

        const flagElements = (typeof detectedFlags !== 'undefined' && detectedFlags)
          ? Array.from(detectedFlags.querySelectorAll('.flag-badge')).map(el => el.innerText.trim())
          : [];

        const cardHeight = flagElements.length > 0 ? 32 : 20;

        // Tarjeta principal
        doc.setFillColor(248, 250, 252);
        doc.setDrawColor(226, 232, 240);
        doc.roundedRect(margin, cursorY, contentWidth, cardHeight, 2, 2, 'FD');

        // Badge Ethic Score
        doc.setFillColor(scoreR, scoreG, scoreB);
        doc.roundedRect(margin + 3, cursorY + 3, 38, 14, 1.5, 1.5, 'F');
        doc.setFont("helvetica", "bold");
        doc.setFontSize(7.5);
        doc.setTextColor(255, 255, 255);
        doc.text("ETHIC-SCORE", margin + 5, cursorY + 7);
        doc.setFontSize(12);
        doc.text(`${levelLabels[lang] || 'NIVEAU'} ${scoreLetter}`, margin + 5, cursorY + 13.5);

        // Metadatos
        doc.setFont("courier", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(51, 65, 85);

        const refText = `${refLabels[lang] || 'RÉFÉRENCE'} : ${auditId}`;
        const dateText = `${dateLabels[lang] || 'HORODATAGE'} : ${timestamp}`;
        doc.text(refText, margin + 46, cursorY + 8);
        doc.text(dateText, margin + 46, cursorY + 13);

        // Banderas / Flags
        if (flagElements.length > 0) {
          doc.setDrawColor(226, 232, 240);
          doc.setLineWidth(0.3);
          doc.line(margin + 3, cursorY + 19, margin + contentWidth - 3, cursorY + 19);

          doc.setFont("helvetica", "bold");
          doc.setFontSize(7.5);
          doc.setTextColor(100, 116, 139);
          doc.text(`${flagsHeaderLabels[lang] || 'INDICATEURS'}:`, margin + 5, cursorY + 26);

          let flagX = margin + 30;
          flagElements.forEach(flagText => {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(7);
            const textWidth = doc.getTextWidth(flagText);
            const badgeWidth = textWidth + 6;

            if (flagX + badgeWidth < margin + contentWidth - 3) {
              doc.setFillColor(226, 232, 240);
              doc.roundedRect(flagX, cursorY + 22, badgeWidth, 5.5, 1, 1, 'F');
              doc.setTextColor(15, 23, 42);
              doc.text(flagText, flagX + 3, cursorY + 26);
              flagX += badgeWidth + 3;
            }
          });
        }

        cursorY += cardHeight + 10;

        // Procesamiento e Impresión Estructurada
        const lines = cleanText.split('\n');

        lines.forEach((line) => {
          let trimmed = line.replace(/^[\s\u00A0\u200B]+|[\s\u00A0\u200B]+$/g, '');

          if (!trimmed || trimmed === '•' || trimmed === '=' || trimmed.startsWith('===')) {
            cursorY += 2;
            return;
          }

          const isHeader = /^[-•\s=]*(PHASE\s*\d|CLASIFICACI[ÓO]N|CLASSIFICATION|NÚCLEO DE HECHOS|NUCLEO DE HECHOS|CORE FACTS|NOYAU DE FAITS|DESMONTAJE COGNITIVO|DÉMONTAGE COGNITIF|DEMONTAGE COGNITIF|COGNITIVE DECONSTRUCTION|DECONSTRUCTION|REENCUADRE CORTICAL|RECADRAGE CORTICAL|CORTICAL REFRAMING|REFRAMING|DÉFI DU BIAIS|DEFI DU BIAIS|DESAFÍO DEL SESGO|DESAFIO DEL SESGO|BIAS CHALLENGE|RÉFUTATION COGNITIVE|REFUTACION COGNITIVA|COGNITIVE REFUTATION)/i.test(trimmed);

          if (isHeader) {
            if (cursorY > pageHeight - 25) { doc.addPage(); cursorY = margin + 5; }
            cursorY += 5;

            let headerText = trimmed.replace(/^[-•\s=]+/, '').toUpperCase();
            printSectionHeader(headerText, margin, cursorY);

            cursorY += 9;
          } else {
            let isBullet = trimmed.startsWith('-') || trimmed.startsWith('•');
            let cleanContent = isBullet ? trimmed.replace(/^[-•]\s*/, '').trim() : trimmed;

            if (!cleanContent) return;

            let hasColonLabel = cleanContent.includes(':') && cleanContent.indexOf(':') < 40 && !/^\d+[\.\)]/.test(cleanContent);

            if (hasColonLabel) {
              if (cursorY > pageHeight - 20) { doc.addPage(); cursorY = margin + 5; }

              let indent = isBullet ? margin + 5 : margin;
              let colonIndex = cleanContent.indexOf(':');
              let labelPart = cleanContent.substring(0, colonIndex + 1);
              let valuePart = cleanContent.substring(colonIndex + 1).trim();

              if (isBullet) {
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.setTextColor(51, 65, 85);
                doc.text("• ", margin, cursorY);
              }

              doc.setFont("helvetica", "bold");
              doc.setFontSize(10);
              doc.setTextColor(15, 23, 42);
              doc.text(labelPart, indent, cursorY);

              let labelWidth = doc.getTextWidth(labelPart + " ");

              doc.setFont("helvetica", "normal");
              doc.setFontSize(10);
              doc.setTextColor(51, 65, 85);

              let maxValWidth = contentWidth - (indent - margin) - labelWidth;
              const splitValue = doc.splitTextToSize(valuePart, maxValWidth);

              if (splitValue.length > 0) {
                doc.text(splitValue[0], indent + labelWidth, cursorY);
                cursorY += 5.5;

                for (let k = 1; k < splitValue.length; k++) {
                  if (cursorY > pageHeight - 20) { doc.addPage(); cursorY = margin + 5; }
                  doc.text(splitValue[k], indent + 4, cursorY);
                  cursorY += 5.5;
                }
              } else {
                cursorY += 5.5;
              }
              cursorY += 1.5;
            } else {
              doc.setFont("helvetica", "normal");
              doc.setFontSize(10);
              doc.setTextColor(51, 65, 85);

              let indent = isBullet ? margin + 5 : margin;
              let printWidth = isBullet ? contentWidth - 5 : contentWidth;
              let printText = isBullet ? "• " + cleanContent : cleanContent;

              const splitLines = doc.splitTextToSize(printText, printWidth);

              splitLines.forEach((subLine) => {
                if (cursorY > pageHeight - 18) { doc.addPage(); cursorY = margin + 5; }
                doc.text(subLine, indent, cursorY);
                cursorY += 5.5;
              });
              cursorY += 1.5;
            }
          }
        });

        // Pie de Página
        const footerLabels = {
          fr: "POLETHIC BEACON — Analyse et autodéfense cognitive",
          es: "POLETHIC BEACON — Análisis y autodefensa cognitiva",
          en: "POLETHIC BEACON — Analysis and cognitive self-defense"
        };

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
          doc.setPage(i);
          doc.setDrawColor(226, 232, 240);
          doc.setLineWidth(0.3);
          doc.line(margin, pageHeight - 12, pageWidth - margin, pageHeight - 12);

          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(148, 163, 184);
          doc.text(footerLabels[lang] || footerLabels['fr'], margin, pageHeight - 7);
          doc.text(`Page ${i} / ${pageCount}`, pageWidth - margin - 15, pageHeight - 7);
        }

        doc.save(`RAPPORT_BEACON_${scoreLetter}_${auditId}.pdf`);
      });

      // 🗑️ PURGAR (Limpiar interfaz)
      btnPurge.addEventListener('click', () => {
        userInput.value = '';
        userFile.value = '';
        
        if (typeof fileNameDisplay !== 'undefined' && fileNameDisplay) {
          const fileBtnText = (typeof langMap !== 'undefined' && langMap[currentLang] && langMap[currentLang].fileBtn) 
            ? langMap[currentLang].fileBtn 
            : 'Fichier / File';
          fileNameDisplay.innerText = fileBtnText;
        }
        
        const resetText = {
          es: 'En espera de análisis...',
          fr: 'En attente d\'analyse...',
          en: 'Waiting for analysis...'
        };
        if (analysisReport) {
          analysisReport.innerText = resetText[currentLang] || resetText.fr;
        }

        const readyText = {
          es: 'ANÁLISIS LISTO',
          fr: 'ANALYSE PRÊTE',
          en: 'ANALYSIS READY'
        };
        if (detectedFlags) {
          detectedFlags.innerHTML = `<span class="flag-badge" id="txt-ready">${readyText[currentLang] || readyText.fr}</span>`;
        }

        stopEthicSpinner();
        
        if (ethicScore) {
          ethicScore.innerText = 'Ethic-Score™: --';
          ethicScore.style.backgroundColor = 'var(--cyber-cyan)';
        }
        
        if (resultsPanel) {
          resultsPanel.style.display = 'none';
        }
        
        lastAnalyzedText = "";
      });
    });
  </script>
</body>
</html>
