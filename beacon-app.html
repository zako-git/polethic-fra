<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLETHIC BEACON — Cognitive Self-Defense Laboratory</title>
  
  <!-- Dependencias externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --cyber-cyan: #00f0ff;
      --cyber-blue: #0077ff;
      --cyber-red: #ff0055;
      --cyber-green: #00ff66;
      --cyber-amber: #ffaa00;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 240, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-title {
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--cyber-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .lang-selector {
      display: flex;
      gap: 10px;
    }

    .btn-lang {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }

    .btn-lang.active, .btn-lang:hover {
      color: var(--cyber-cyan);
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(10, 14, 23, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 15px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 15px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .input-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .btn-file {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-block;
      transition: all 0.3s;
    }

    .btn-file:hover {
      background: var(--cyber-cyan);
      color: var(--bg-dark);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--cyber-cyan);
      color: var(--bg-dark);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .btn-primary:hover {
      background: #33f3ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
    }

    .btn-danger {
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid var(--cyber-red);
      color: var(--cyber-red);
    }

    .btn-danger:hover {
      background: var(--cyber-red);
      color: white;
    }

    .btn-secondary {
      background: rgba(0, 119, 255, 0.2);
      border: 1px solid var(--cyber-blue);
      color: var(--cyber-blue);
    }

    .btn-secondary:hover {
      background: var(--cyber-blue);
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Targeta de Resultados */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ethic-badge {
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      background: var(--cyber-cyan);
      color: var(--bg-dark);
    }

    .flag-badge {
      display: inline-block;
      padding: 4px 8px;
      margin: 2px;
      border-radius: 3px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .report-content {
      white-space: pre-wrap;
      line-height: 1.6;
      font-family: 'Courier New', Courier, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 6px;
      border-left: 3px solid var(--cyber-cyan);
      max-height: 500px;
      overflow-y: auto;
    }

    .status-bar {
      margin-top: 15px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--cyber-cyan);
    }
  </style>
</head>
<body>

  <div id="stars-container"></div>

  <div class="app-container">
    <header>
      <div class="logo-zone">
        <div class="logo-title">POLETHIC BEACON</div>
      </div>
      <div class="lang-selector">
        <button class="btn-lang active" data-lang="fr">FR</button>
        <button class="btn-lang" data-lang="es">ES</button>
        <button class="btn-lang" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section class="panel input-panel">
        <textarea id="user-input" placeholder="Collez votre texte, lien YouTube ou téléchargez un documento ici..."></textarea>
        
        <div class="input-controls">
          <div class="file-input-wrapper">
            <label for="user-file" class="btn-file" id="lbl-file">Fichier / File</label>
            <input type="file" id="user-file" accept="image/*,application/pdf">
            <span id="file-name" style="margin-left: 10px; font-size: 0.85rem; color: var(--text-muted);"></span>
          </div>

          <div class="action-btns">
            <button id="btn-purge" class="btn btn-danger">Purge</button>
            <button id="btn-analyze" class="btn btn-primary">Analyser</button>
          </div>
        </div>
      </section>

      <section class="panel results-panel" id="results-panel" style="display: none;">
        <div class="results-header">
          <div id="ethic-score" class="ethic-badge">Ethic-Score™: --</div>
          <div id="detected-flags">
            <span class="flag-badge" id="txt-ready">ANALYSE PRÊTE</span>
          </div>
        </div>

        <div id="analysis-report" class="report-content">En attente d'analyse...</div>

        <div class="input-controls" style="margin-top: 20px;">
          <button id="btn-refute" class="btn btn-secondary">Refutar / Défi</button>
          <button id="btn-pdf" class="btn btn-primary">Export PDF</button>
        </div>

        <div class="status-bar" id="txt-status">● SYSTEM ONLINE</div>
      </section>
    </main>
  </div>

  <script>
    // Configurar Worker de PDF.js
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const API_BASE_URL = 'https://polethic-beacon.onrender.com'; // Ajusta según la URL real de Render

    // Idiomas
    const langMap = {
      fr: {
        fileBtn: 'Fichier / File',
        noAnalysisAlert: "Aucune analyse disponible pour la réfutation.",
        refuting: "Réfutation en cours...",
        refuteBtn: "Réfuter / Défi",
        noExportAlert: "Aucun rapport disponible à exporter."
      },
      es: {
        fileBtn: 'Archivo / File',
        noAnalysisAlert: "No hay un análisis disponible para refutar.",
        refuting: "Refutando...",
        refuteBtn: "Refutar / Défi",
        noExportAlert: "No hay informe disponible para exportar."
      },
      en: {
        fileBtn: 'File / Upload',
        noAnalysisAlert: "No analysis available to refute.",
        refuting: "Refuting...",
        refuteBtn: "Refute / Challenge",
        noExportAlert: "No report available for export."
      }
    };

    let currentLang = 'fr';
    let lastAnalyzedText = "";
    let currentScoreLetter = 'C';
    let spinnerInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Elementos del DOM
      const userInput = document.getElementById('user-input');
      const userFile = document.getElementById('user-file');
      const fileNameDisplay = document.getElementById('file-name');
      const btnAnalyze = document.getElementById('btn-analyze');
      const btnPurge = document.getElementById('btn-purge');
      const btnRefute = document.getElementById('btn-refute');
      const btnPdf = document.getElementById('btn-pdf');
      const resultsPanel = document.getElementById('results-panel');
      const analysisReport = document.getElementById('analysis-report');
      const ethicScore = document.getElementById('ethic-score');
      const detectedFlags = document.getElementById('detected-flags');

      // Generar Fondo de Estrellas
      function generateStars() {
        const container = document.getElementById('stars-container');
        if (!container) return;
        container.innerHTML = '';
        for (let i = 0; i < 80; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.width = `${Math.random() * 3}px`;
          star.style.height = star.style.width;
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 100}%`;
          star.style.animationDuration = `${2 + Math.random() * 3}s`;
          container.appendChild(star);
        }
      }
      generateStars();

      // Cambio de Idioma
      document.querySelectorAll('.btn-lang').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentLang = e.target.getAttribute('data-lang');
          document.getElementById('lbl-file').innerText = langMap[currentLang].fileBtn;
        });
      });

      // Selector de Archivo
      userFile.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          fileNameDisplay.innerText = e.target.files[0].name;
        } else {
          fileNameDisplay.innerText = '';
        }
      });

      // Animación de Carga (Spinner Ethic)
      function startEthicSpinner() {
        let frames = ['[  =  ]', '[ ==  ]', '[ === ]', '[  == ]'];
        let idx = 0;
        spinnerInterval = setInterval(() => {
          ethicScore.innerText = `Ethic-Score™: ${frames[idx % frames.length]}`;
          idx++;
        }, 200);
      }

      function stopEthicSpinner() {
        if (spinnerInterval) clearInterval(spinnerInterval);
      }

      function applyEthicBadge(score, flags = []) {
        stopEthicSpinner();
        currentScoreLetter = score || 'C';
        ethicScore.innerText = `Ethic-Score™: ${currentScoreLetter}`;

        let colorMap = {
          'A': 'var(--cyber-green)',
          'B': 'var(--cyber-cyan)',
          'C': 'var(--cyber-amber)',
          'D': 'var(--cyber-red)'
        };
        ethicScore.style.backgroundColor = colorMap[currentScoreLetter] || 'var(--cyber-amber)';

        if (detectedFlags && Array.isArray(flags)) {
          detectedFlags.innerHTML = flags.map(f => `<span class="flag-badge">${f}</span>`).join('');
        }
      }

      // Funciones de Extracción Local (OCR & PDF)
      async function extractTextFromImage(file) {
        document.getElementById('txt-status').innerText = '● LECTURE OCR (TESSERACT)...';
        const worker = await Tesseract.createWorker(currentLang === 'es' ? 'spa' : (currentLang === 'fr' ? 'fra' : 'eng'));
        const ret = await worker.recognize(file);
        await worker.terminate();
        return ret.data.text;
      }

      async function extractTextFromPDF(file) {
        document.getElementById('txt-status').innerText = '● EXTRACTION PDF...';
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          fullText += content.items.map(item => item.str).join(' ') + '\n';
        }
        return fullText;
      }

      function extractYouTubeID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
      }

      // ⚡ ANALIZAR
      btnAnalyze.addEventListener('click', async () => {
        let textToAnalyze = userInput.value.trim();
        const file = userFile.files[0];

        if (!textToAnalyze && !file) {
          return alert("Por favor ingrese texto, una URL de YouTube o un archivo.");
        }

        btnAnalyze.disabled = true;
        resultsPanel.style.display = 'block';
        startEthicSpinner();

        try {
          if (file) {
            if (file.type.startsWith('image/')) {
              textToAnalyze = await extractTextFromImage(file);
            } else if (file.type === 'application/pdf') {
              textToAnalyze = await extractTextFromPDF(file);
            }
          } else if (extractYouTubeID(textToAnalyze)) {
            const videoId = extractYouTubeID(textToAnalyze);
            document.getElementById('txt-status').innerText = `● YOUTUBE TRANSCRIPT (${videoId})...`;
            const ytResponse = await fetch(`${API_BASE_URL}/transcript?videoId=${videoId}`);
            if (!ytResponse.ok) throw new Error(`YouTube API Error: ${ytResponse.status}`);
            const ytData = await ytResponse.json();
            textToAnalyze = ytData.fullText || ytData.text || ytData.transcript;
          }

          if (!textToAnalyze) throw new Error("No se pudo extraer texto.");

          userInput.value = textToAnalyze;
          lastAnalyzedText = textToAnalyze;

          document.getElementById('txt-status').innerText = '● CONNECTING TO BACKEND...';

          const response = await fetch(`${API_BASE_URL}/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: textToAnalyze, lang: currentLang })
          });

          if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

          const data = await response.json();
          const flagsReceived = data.flags || data.detected_flags || [];
          const scoreReceived = data.ethic_letter || data.score || 'C';
          const reportText = data.analysis || data.report || 'Analyse terminée.';

          applyEthicBadge(scoreReceived, flagsReceived);
          analysisReport.innerText = reportText;
          document.getElementById('txt-status').innerText = '● ANALYSE TERMINÉE | SYSTEM ONLINE';

        } catch (e) {
          console.error(e);
          applyEthicBadge('C');
          analysisReport.innerText = `⚠️ Error:\n${e.message}\n\nSi Render estuvo inactivo, espere 30s y reintente.`;
          document.getElementById('txt-status').innerText = '● ERREUR SYSTEME';
        } finally {
          btnAnalyze.disabled = false;
        }
      });

      // 🔄 REFUTAR
      btnRefute.addEventListener('click', async () => {
        const currentAnalysis = analysisReport ? analysisReport.innerText : '';
        const t = langMap[currentLang] || langMap.fr;

        if (!currentAnalysis || currentAnalysis.includes("En attente") || currentAnalysis.includes("Erreur")) {
          return alert(t.noAnalysisAlert);
        }

        btnRefute.disabled = true;
        btnRefute.innerText = t.refuting;

        try {
          const response = await fetch(`${API_BASE_URL}/refute`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ analysis: currentAnalysis, text: lastAnalyzedText, lang: currentLang })
          });

          if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

          const data = await response.json();
          const refutationText = data.refutation || data.reply || '';

          if (refutationText) {
            analysisReport.innerText += `\n\n========================================\n🔥 DÉFI DU BIAIS (RÉFUTATION COGNITIVE):\n========================================\n${refutationText}`;
          }
        } catch (e) {
          alert("Erreur lors du traitement de la réfutation.");
        } finally {
          btnRefute.disabled = false;
          btnRefute.innerText = t.refuteBtn;
        }
      });

      // 📄 EXPORTAR PDF
      btnPdf.addEventListener('click', () => {
        const reportText = analysisReport ? analysisReport.innerText : '';
        if (!reportText || reportText.includes("En attente") || reportText.includes("Erreur")) {
          return alert("No hay informe disponible para exportar.");
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 18;
        const contentWidth = pageWidth - (margin * 2);
        let cursorY = margin;

        let cleanText = reportText.replace(/\*\*/g, '').trim();

        doc.setFont("courier", "bold");
        doc.setFontSize(15);
        doc.text("POLETHIC BEACON", margin, cursorY + 2);

        cursorY += 15;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);

        const splitText = doc.splitTextToSize(cleanText, contentWidth);
        splitText.forEach((line) => {
          if (cursorY + 7 > pageHeight - margin) {
            doc.addPage();
            cursorY = margin;
          }
          doc.text(line, margin, cursorY);
          cursorY += 5;
        });

        doc.save(`Rapport_Beacon_${currentScoreLetter}.pdf`);
      });

      // 🗑️ PURGAR
      btnPurge.addEventListener('click', () => {
        userInput.value = '';
        userFile.value = '';
        fileNameDisplay.innerText = '';
        analysisReport.innerText = 'En attente d\'analyse...';
        detectedFlags.innerHTML = '<span class="flag-badge">ANALYSE PRÊTE</span>';
        stopEthicSpinner();
        ethicScore.innerText = 'Ethic-Score™: --';
        ethicScore.style.backgroundColor = 'var(--cyber-cyan)';
        resultsPanel.style.display = 'none';
        lastAnalyzedText = "";
      });
    });
  </script>
</body>
</html>
