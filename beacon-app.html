<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLETHIC BEACON | Moteur d'Autodéfense Cognitive</title>
  
  <style>
    /* ==========================================
       ESTILOS CYBER TOTAL (INCORPORADOS)
       ========================================== */
    :root {
      --cyber-cyan: #00f0ff;
      --cyber-green: #00ff88;
      --cyber-red: #ff2a6d;
      --cyber-yellow: #ffe600;
      --cyber-bg: #030a12;
      --cyber-card-bg: rgba(5, 16, 28, 0.85);
      --font-cyber: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--cyber-bg);
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* CABECERA Y NAVEGACIÓN */
    header {
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(3, 10, 18, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-layout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-title {
      font-family: var(--font-cyber);
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--cyber-cyan);
      text-decoration: none;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      letter-spacing: 2px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      color: #8a9ba8;
      text-decoration: none;
      font-size: 0.82rem;
      font-family: var(--font-cyber);
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--cyber-cyan);
      border-color: rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.05);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .lang-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-cyber);
      font-size: 0.8rem;
    }

    .lang-btn {
      color: #5a6e7f;
      text-decoration: none;
      padding: 2px 6px;
    }

    .lang-btn.active {
      color: var(--cyber-green);
      font-weight: bold;
    }

    .lang-separator { color: #334455; }

    /* SECCIÓN PRINCIPAL */
    .beacon-title-block {
      text-align: center;
      margin: 40px 0 25px 0;
    }

    .hero-app-title {
      font-family: var(--font-cyber);
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 12px var(--cyber-cyan);
      letter-spacing: 3px;
    }

    .subtitle {
      color: var(--cyber-cyan);
      font-family: var(--font-cyber);
      font-size: 0.9rem;
      margin-top: 6px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    /* TARJETA DE ENTRADA TÁCTICA */
    .input-card {
      background: var(--cyber-card-bg);
      border: 1px solid var(--cyber-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
      border-radius: 6px;
      padding: 25px;
      max-width: 800px;
      margin: 0 auto 30px auto;
      backdrop-filter: blur(8px);
    }

    .window-title {
      color: #ffffff;
      font-size: 0.95rem;
      margin-bottom: 12px;
      font-family: var(--font-cyber);
      border-left: 3px solid var(--cyber-cyan);
      padding-left: 10px;
    }

    textarea#user-input {
      width: 100%;
      height: 130px;
      background: rgba(1, 6, 12, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      color: var(--cyber-green);
      font-family: var(--font-cyber);
      font-size: 0.95rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: all 0.3s ease;
    }

    textarea#user-input:focus {
      border-color: var(--cyber-cyan);
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2), 0 0 12px rgba(0, 240, 255, 0.3);
    }

    /* BARRA DE ACCIONES */
    .input-actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }

    .file-upload-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-cyber);
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .file-upload-btn:hover {
      background: var(--cyber-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--cyber-cyan);
    }

    .btn-beacon-primary {
      flex-grow: 1;
      background: transparent;
      border: 1px solid var(--cyber-cyan);
      color: var(--cyber-cyan);
      font-family: var(--font-cyber);
      font-weight: bold;
      font-size: 1rem;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      text-shadow: 0 0 5px var(--cyber-cyan);
    }

    .btn-beacon-primary:hover {
      background: var(--cyber-cyan);
      color: #030a12;
      text-shadow: none;
      box-shadow: 0 0 25px var(--cyber-cyan);
    }

    .status-bar {
      margin-top: 15px;
      font-family: var(--font-cyber);
      font-size: 0.75rem;
      color: var(--cyber-green);
      letter-spacing: 1px;
    }

    /* PANEL DE RESULTADOS DINÁMICO */
    .results-card {
      background: rgba(3, 15, 25, 0.95);
      border: 1px solid var(--cyber-green);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.2);
      border-radius: 6px;
      padding: 25px;
      max-width: 800px;
      margin: 0 auto 40px auto;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 255, 136, 0.25);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .ethic-score-badge {
      background: var(--cyber-cyan);
      color: #030a12;
      font-family: var(--font-cyber);
      font-weight: bold;
      font-size: 1.1rem;
      padding: 6px 14px;
      border-radius: 3px;
      box-shadow: 0 0 12px var(--cyber-cyan);
    }

    .report-box {
      background: rgba(0, 0, 0, 0.6);
      border-left: 3px solid var(--cyber-green);
      padding: 15px;
      color: #d0e0e0;
      font-family: var(--font-cyber);
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .results-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-action-refute, .btn-action-pdf, .btn-action-purge {
      background: transparent;
      font-family: var(--font-cyber);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-action-refute { border: 1px solid var(--cyber-yellow); color: var(--cyber-yellow); }
    .btn-action-refute:hover { background: var(--cyber-yellow); color: #000; box-shadow: 0 0 10px var(--cyber-yellow); }

    .btn-action-pdf { border: 1px solid var(--cyber-cyan); color: var(--cyber-cyan); }
    .btn-action-pdf:hover { background: var(--cyber-cyan); color: #000; box-shadow: 0 0 10px var(--cyber-cyan); }

    .btn-action-purge { border: 1px solid var(--cyber-red); color: var(--cyber-red); }
    .btn-action-purge:hover { background: var(--cyber-red); color: #fff; box-shadow: 0 0 10px var(--cyber-red); }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(0, 240, 255, 0.15);
      padding: 30px 0;
      margin-top: 40px;
      text-align: center;
      font-size: 0.8rem;
      color: #5a6e7f;
      font-family: var(--font-cyber);
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="container header-layout">
      <a href="index.html" class="logo-title">POLETHIC_FRA</a>
      
      <nav class="nav-buttons">
        <a href="index.html" class="nav-btn">ACCUEIL</a>
        <a href="observatoire.html" class="nav-btn">L'OBSERVATOIRE</a>
        <a href="psicomusee.html" class="nav-btn">PSICOMUSÉE</a>
        <a href="beacon-app.html" class="nav-btn active">BEACON LAB</a>
        <a href="notre-cap.html" class="nav-btn">NOTRE CAP</a>
        <a href="contact.html" class="nav-btn">CONTACT</a>
      </nav>

      <div class="lang-selector">
        <a href="#" class="lang-btn active" id="btn-fr">FR</a>
        <span class="lang-separator">|</span>
        <a href="#" class="lang-btn" id="btn-es">ES</a>
        <span class="lang-separator">|</span>
        <a href="#" class="lang-btn" id="btn-en">EN</a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO BEACON LAB -->
  <main class="container">
    
    <div class="beacon-title-block">
      <h1 class="hero-app-title">POLETHIC BEACON</h1>
      <p class="subtitle">Moteur d'autodéfense cognitive & Analyse métacommunicationnelle</p>
    </div>

    <!-- CONSOLA TÁCTICA DE ENTRADA -->
    <section class="input-card">
      
      <textarea id="user-input" placeholder="Collez du texte média, des articles politiques, des liens ou des déclarations..."></textarea>
      
      <div class="input-actions-bar">
        <label for="user-file" class="file-upload-btn" title="Adjuntar imagen">
          📷 <span id="file-name-display"></span>
        </label>
        <input type="file" id="user-file" accept="image/*,.pdf" style="display: none;" />

        <button id="btn-analyze" class="btn-beacon-primary">
          ⚡ BEACONISER
        </button>
      </div>

      <div class="status-bar">
        <span>● MOTEUR PRÊT</span>
      </div>
    </section>

    <!-- PANEL DE RESULTADOS (OCULTO HASTA ANALIZAR) -->
    <section id="results-panel" class="results-card" style="display: none;">
      <div class="results-header">
        <div id="ethic-score" class="ethic-score-badge">Ethic-Score™: --</div>
        <div id="detected-flags-container"></div>
      </div>

      <div class="analysis-body">
        <div id="analysis-report" class="report-box"></div>
      </div>

      <div class="results-actions">
        <button id="btn-refute" class="btn-action-refute">🔄 REFUTER</button>
        <button id="btn-pdf" class="btn-action-pdf">📄 EXPORT PDF</button>
        <button id="btn-purge" class="btn-action-purge">🗑️ PURGER</button>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 POLETHIC France • Association Loi 1901. Tous droits réservés.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
