<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLETHIC BEACON — Cognitive Self-Defense Engine</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #020617;
      --cyan-glow: #00f2fe;
      --cyan-dim: rgba(0, 242, 254, 0.15);
      --card-bg: rgba(13, 23, 42, 0.8);
      --card-border: rgba(0, 242, 254, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green-action: #10b981;
      --green-glow: rgba(16, 185, 129, 0.4);

      /* Colores para la amenaza por Letras */
      --threat-a: #10b981; /* Verde */
      --threat-b: #38bdf8; /* Azul */
      --threat-c: #f59e0b; /* Naranja */
      --threat-d: #ef4444; /* Rojo */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* FONDO ESTRELLADO CIBERNÉTICO TURQUESA */
    .cyber-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -2;
      background: 
        radial-gradient(circle at 50% 15%, rgba(0, 242, 254, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #020617 0%, #031329 100%);
    }

    .stars-layer {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background-image: 
        radial-gradient(1.5px 1.5px at 30px 40px, #00f2fe, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 200px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 290px 80px, #00f2fe, rgba(0,0,0,0)),
        radial-gradient(2.5px 2.5px at 420px 350px, rgba(0,242,254,0.9), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 680px 140px, #00f2fe, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 820px 480px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 900px 550px;
      opacity: 0.7;
      animation: twinkle 6s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0.9; transform: scale(1.01); }
    }

    /* ESTILOS DE LA CABECERA UNIFICADA DE NAVEGACIÓN */
    header {
      width: 100%;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      background: rgba(2, 6, 23, 0.85);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-layout {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
    }

    .logo-title {
      font-family: 'Fira Code', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--cyan-glow);
      text-shadow: 0 0 12px var(--cyan-glow);
      text-decoration: none;
    }

    .nav-buttons {
      display: flex;
      gap: 1.25rem;
    }

    .nav-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: 'Fira Code', monospace;
      transition: all 0.3s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--cyan-glow);
      text-shadow: 0 0 8px var(--cyan-dim);
    }

    .lang-selector {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
    }

    .lang-btn {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .lang-btn:hover, .lang-btn.active {
      color: var(--cyan-glow);
      font-weight: bold;
    }

    .lang-separator {
      color: rgba(255, 255, 255, 0.2);
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      max-width: 950px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    .app-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .app-header h1 {
      font-family: 'Fira Code', monospace;
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
    }

    .app-header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }

    /* PESTAÑAS / MÓDULOS */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.85rem 0.5rem;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      border-color: var(--cyan-glow);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(16, 185, 129, 0.15));
      border-color: var(--cyan-glow);
      color: #ffffff;
      box-shadow: 0 0 18px var(--cyan-dim);
      font-weight: 600;
    }

    /* TARJETAS GLASSMORPHISM */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.75rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px 8px 0 0;
      padding: 1rem;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s ease;
      display: block;
    }

    textarea:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 12px var(--cyan-dim);
    }

    .textarea-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(2, 6, 23, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 0.5rem 0.75rem;
      margin-top: -1px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon-upload {
      background: rgba(0, 242, 254, 0.08);
      border: 1px solid var(--card-border);
      color: var(--cyan-glow);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .btn-icon-upload:hover {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--cyan-glow);
      box-shadow: 0 0 10px var(--cyan-dim);
      transform: translateY(-1px);
    }

    .file-status {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: var(--green-action);
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BOTONES */
    .action-row {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .btn-beacon {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 1.1rem;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px var(--green-glow);
    }

    .btn-beacon:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--green-glow);
      filter: brightness(1.1);
    }

    .secondary-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      padding: 0.75rem;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      border-color: var(--cyan-glow);
      color: var(--text-main);
    }

    /* REPORTE DE RESULTADOS CON CLASES DE LETRA/AMENAZA */
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 0.75rem;
    }

    .report-title {
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .score-badge {
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--cyan-glow);
      text-shadow: 0 0 10px var(--cyan-glow);
      transition: all 0.3s ease;
    }

    /* Dinámica de colores por Letras (A, B, C, D) */
    .score-badge.grade-a { color: var(--threat-a); text-shadow: 0 0 12px var(--threat-a); }
    .score-badge.grade-b { color: var(--threat-b); text-shadow: 0 0 12px var(--threat-b); }
    .score-badge.grade-c { color: var(--threat-c); text-shadow: 0 0 12px var(--threat-c); }
    .score-badge.grade-d { color: var(--threat-d); text-shadow: 0 0 12px var(--threat-d); }

    .report-content {
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      background: rgba(2, 6, 23, 0.6);
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="cyber-bg"></div>
  <div class="stars-layer"></div>

  <!-- CABECERA DE NAVEGACIÓN COMPLETA Y UNIFICADA -->
  <header>
    <div class="header-layout">
      <!-- LOGO -->
      <a href="index.html" class="logo-title">POLETHIC_FRA</a>
      
      <!-- MENÚ DE NAVEGACIÓN -->
      <nav class="nav-buttons">
        <a href="index.html" class="nav-btn" data-key="nav_home">ACCUEIL</a>
        <a href="observatoire.html" class="nav-btn" data-key="nav_obs">L'OBSERVATOIRE</a>
        <a href="psicomusee.html" class="nav-btn" data-key="nav_museum">PSICOMUSÉE</a>
        <a href="beacon-app.html" class="nav-btn active" data-key="nav_beacon">BEACON LAB</a>
        <a href="notre-cap.html" class="nav-btn" data-key="nav_cap">NOTRE CAP</a>
        <a href="contact.html" class="nav-btn" data-key="nav_contact">CONTACT</a>
      </nav>

      <!-- SELECTOR DE IDIOMAS CON SUS IDs -->
      <div class="lang-selector">
        <a href="#" class="lang-btn active" id="btn-fr" onclick="changeLang('fr', event)">FR</a>
        <span class="lang-separator">|</span>
        <a href="#" class="lang-btn" id="btn-es" onclick="changeLang('es', event)">ES</a>
        <span class="lang-separator">|</span>
        <a href="#" class="lang-btn" id="btn-en" onclick="changeLang('en', event)">EN</a>
      </div>
    </div>
  </header>

  <main>
    <div class="app-header">
      <h1>POLETHIC BEACON</h1>
      <p id="subHeader">Cognitive Self-Defense Engine & Metacommunication Analyzer</p>
    </div>

    <!-- PESTAÑAS -->
    <div class="modules-grid">
      <button class="tab-btn active" onclick="selectModule('news', this)">1. FakeNews</button>
      <button class="tab-btn" onclick="selectModule('myth', this)">2. Myth-Buster</button>
      <button class="tab-btn" onclick="selectModule('identity', this)">3. Identity Spoofing</button>
      <button class="tab-btn" onclick="selectModule('coercive', this)">4. Coercive Filter</button>
    </div>

    <!-- ÁREA DE ENTRADA CON BARRA PARA SUBIR FOTO -->
    <div class="glass-card">
      <textarea id="userInput" placeholder="Collez du texte média, des articles politiques ou joignez une image..."></textarea>
      
      <div class="textarea-toolbar">
        <div class="toolbar-left">
          <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageSelected(this)">
          <button class="btn-icon-upload" type="button" onclick="document.getElementById('imageUpload').click()" title="Téléverser une image / Adjuntar foto">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <span id="fileStatus" class="file-status"></span>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-beacon" id="btnBeacon" onclick="runBeaconAnalysis()">BEACON-IZE</button>
        <div class="secondary-btns">
          <button class="btn-secondary" id="btnPurge" onclick="purgeSession()">PURGE SESSION</button>
          <button class="btn-secondary" id="btnExport" onclick="exportPDF()">EXPORT PDF</button>
        </div>
      </div>
    </div>

    <!-- REPORTE -->
    <div class="glass-card">
      <div class="report-header">
        <span class="report-title" id="reportTitle">FORENSIC METRICS REPORT</span>
        <span class="score-badge" id="scoreDisplay">Ethic-Score™: --</span>
      </div>
      <div class="report-content" id="analysisResult">Veuillez introduire du contenu ou joindre une image pour analyser.</div>
    </div>
  </main>

  <script>
    let activeModule = "news";
    let currentLang = "fr"; // Idioma por defecto
    let lastNumericScore = 0; // Puntuación interna en memoria para el exportador de PDF

    // TRADUCCIONES DE LA INTERFAZ
    const i18n = {
      fr: {
        placeholders: {
          news: "Collez du texte média, des articles politiques ou des liens vidéo...",
          myth: "Collez des affirmations sur la médecine alternative ou des théories non vérifiées...",
          identity: "Collez des données de bio ou des identifiants suspects...",
          coercive: "Collez des discours de vente à haute pression ou de la manipulation..."
        },
        ethicLabel: "Ethic-Score™",
        empty: "Veuillez introduire du contenu ou joindre une image pour analyser.",
        processing: "Analyse des motifs linguistiques et des structures rhétoriques...",
        offline: "Système hors ligne. Vérifiez votre connexion avec le serveur.",
        error: "Erreur lors de l'audit médico-légal.",
        btnAnalyze: "BEACON-IZE",
        btnPurge: "PURGER LA SESSION",
        btnExport: "EXPORTER EN PDF"
      },
      es: {
        placeholders: {
          news: "Pega texto de prensa, artículos políticos o enlaces de vídeo...",
          myth: "Pega afirmaciones sobre medicina alternativa o teorías no verificadas...",
          identity: "Pega biografías o credenciales sospechosas para analizar...",
          coercion: "Pega discursos de alta presión, manipulación o ventas agresivas..."
        },
        ethicLabel: "Ethic-Score™",
        empty: "Por favor, introduce algún contenido o adjunta una imagen para analizar.",
        processing: "Ejecutando análisis de patrones lingüísticos y estructuras retóricas...",
        offline: "Sistema fuera de línea. Verifica la conexión con el servidor.",
        error: "Error durante la auditoría forense.",
        btnAnalyze: "ANALIZAR",
        btnPurge: "PURGAR SESIÓN",
        btnExport: "EXPORTAR PDF"
      },
      en: {
        placeholders: {
          news: "Paste media text, political articles, or video links...",
          myth: "Paste claims regarding alternative medicine or unverified theories...",
          identity: "Paste suspicious bio data or credentials to audit...",
          coercion: "Paste high-pressure sales pitches or manipulation..."
        },
        ethicLabel: "Ethic-Score™",
        empty: "Please introduce some content or attach an image to analyze.",
        processing: "Analyzing neural patterns, predictive brain loops, and rhetorical structures...",
        offline: "System offline. Please check your connection to the server.",
        error: "Error processing forensic audit.",
        btnAnalyze: "BEACON-IZE",
        btnPurge: "PURGE SESSION",
        btnExport: "EXPORT PDF"
      }
    };

    // Detección automática del Backend
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_URL = isLocal 
      ? "http://127.0.0.1:5000" 
      : "https://polethic-beacon-api.onrender.com";

    // MAPEO DE NÚMEROS A SOLAMENTE LETRAS (A, B, C, D)
    function scoreToLetter(score) {
      if (score >= 80) return { letter: "A", class: "grade-a" }; // Verde
      if (score >= 60) return { letter: "B", class: "grade-b" }; // Azul
      if (score >= 40) return { letter: "C", class: "grade-c" }; // Naranja
      return { letter: "D", class: "grade-d" };                 // Rojo
    }

    function changeLang(lang, e) {
      if (e) e.preventDefault();
      currentLang = lang;

      // Actualizar visualmente la cabecera
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');

      // Actualizar textos e indicaciones
      const t = i18n[lang];
      document.getElementById('userInput').placeholder = t.placeholders[activeModule] || t.placeholders.news;
      document.getElementById('btnBeacon').innerText = t.btnAnalyze;
      document.getElementById('btnPurge').innerText = t.btnPurge;
      document.getElementById('btnExport').innerText = t.btnExport;
    }

    function selectModule(moduleKey, btn) {
      activeModule = moduleKey;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const t = i18n[currentLang];
      document.getElementById('userInput').placeholder = t.placeholders[moduleKey] || t.placeholders.news;
    }

    function handleImageSelected(input) {
      const statusSpan = document.getElementById('fileStatus');
      if (input.files && input.files[0]) {
        statusSpan.innerHTML = `📷 ${input.files[0].name} <span style="cursor:pointer; color:#ef4444; margin-left:8px;" onclick="clearImage(event)">✖</span>`;
      } else {
        statusSpan.innerText = "";
      }
    }

    function clearImage(e) {
      if(e) e.stopPropagation();
      const fileInput = document.getElementById('imageUpload');
      fileInput.value = '';
      document.getElementById('fileStatus').innerText = '';
    }

    async function runBeaconAnalysis() {
      const textInput = document.getElementById('userInput').value;
      const resultBox = document.getElementById('analysisResult');
      const scoreBadge = document.getElementById('scoreDisplay');
      const fileInput = document.getElementById('imageUpload');
      const t = i18n[currentLang];

      if (!textInput.trim() && (!fileInput.files || fileInput.files.length === 0)) {
        resultBox.innerText = t.empty;
        return;
      }

      resultBox.innerText = t.processing;
      scoreBadge.innerText = `${t.ethicLabel}: ...`;
      scoreBadge.className = "score-badge";

      try {
        const formData = new FormData();
        
        if (fileInput.files && fileInput.files[0]) {
          formData.append('file', fileInput.files[0]);
        }
        
        formData.append('text', textInput);
        formData.append('module', activeModule);
        formData.append('lang', currentLang); // Le mandamos el idioma actual al backend

        const response = await fetch(`${API_URL}/analyze`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          lastNumericScore = data.score;
          const grade = scoreToLetter(data.score);

          // Imprimimos la LETRA con su color dinámico
          scoreBadge.innerText = `${t.ethicLabel}: ${grade.letter}`;
          scoreBadge.className = `score-badge ${grade.class}`;

          resultBox.innerText = data.analysis;
        } else {
          resultBox.innerText = `Error: ${data.analysis || t.error}`;
          scoreBadge.innerText = `${t.ethicLabel}: ERROR`;
        }
      } catch (err) {
        console.error("Error de conexión:", err);
        resultBox.innerText = t.offline;
        scoreBadge.innerText = `${t.ethicLabel}: OFFLINE`;
      }
    }

    function purgeSession() {
      const t = i18n[currentLang];
      document.getElementById('userInput').value = '';
      clearImage();
      document.getElementById('analysisResult').innerText = t.empty;
      
      const scoreBadge = document.getElementById('scoreDisplay');
      scoreBadge.innerText = `${t.ethicLabel}: --`;
      scoreBadge.className = "score-badge";
      lastNumericScore = 0;
    }

    async function exportPDF() {
      const scoreText = document.getElementById('scoreDisplay').innerText;
      const analysisText = document.getElementById('analysisResult').innerText;

      if (scoreText.includes("--") || scoreText.includes("OFFLINE") || scoreText.includes("...")) {
        alert("Veuillez realizar un análisis válido antes de exportar.");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/export_pdf`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            score: lastNumericScore, 
            analysis: analysisText, 
            module: activeModule,
            lang: currentLang 
          })
        });

        if (response.ok) {
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Polethic_Beacon_${activeModule}_Report.pdf`;
          a.click();
        } else {
          throw new Error("Server PDF generation failed");
        }
      } catch (err) {
        window.print();
      }
    }
  </script>
</body>
</html>
